[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tool-using-agent"
version = "0.1.0"
description = "A minimal, framework-free tool-using agent loop with a deterministic offline planner."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "awf-cpu" }]
dependencies = []

[project.optional-dependencies]
openai = ["openai>=1.0"]
dev = ["pytest>=7.4"]

[tool.setuptools]
packages = ["agent"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
